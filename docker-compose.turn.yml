# Coturn: o relay que faz a live no modo ponto a ponto funcionar para quem está
# atrás de NAT simétrico (4G, e boa parte dos provedores que usam CGNAT). Sem
# ele essas pessoas ficam tentando conectar para sempre, porque não existe rota
# direta entre os dois navegadores.
#
# Suba como um recurso Docker Compose no Coolify e libere no firewall da
# Contabo e no ufw do VPS:
#   3478/udp e 3478/tcp   sinalização e alocação do relay
#   49160-49200/udp       portas por onde a mídia retransmitida passa
#
# Variáveis obrigatórias:
#   TURN_REALM        domínio do relay, ex.: turn.seudominio.com
#   TURN_USERNAME     usuário, ex.: timbas
#   TURN_CREDENTIAL   segredo longo e aleatório (openssl rand -hex 32)
#   TURN_EXTERNAL_IP  IP público do VPS
#
# Depois configure na API (mesmo valor de usuário e segredo):
#   TURN_URLS="turn:turn.seudominio.com:3478,turn:turn.seudominio.com:3478?transport=tcp"
#   TURN_USERNAME / TURN_CREDENTIAL
#
# ATENÇÃO ao rodar junto com o LiveKit: o TURN embutido dele também escuta na
# 3478/udp. Use um dos dois no VPS, ou mude TURN_PORT aqui e ajuste TURN_URLS.

services:
  turn:
    image: coturn/coturn:4.11.0
    container_name: timbas-turn
    restart: unless-stopped
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      # ~40 alocações simultâneas, ou seja ~40 espectadores precisando de relay
      # ao mesmo tempo. Publicar faixa muito maior deixa o container lento para
      # subir, porque o Docker cria um proxy por porta.
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --user=${TURN_USERNAME:?TURN_USERNAME is required}:${TURN_CREDENTIAL:?TURN_CREDENTIAL is required}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=49160
      - --max-port=49200
      # O usuário e o segredo vão para o navegador de todo mundo que assiste,
      # então tratamos as credenciais como públicas. Estes limites são o que
      # impede o relay de virar banda de graça para estranhos.
      - --user-quota=12
      - --total-quota=200
      - --max-bps=2000000
      - --stale-nonce=600
      # Um relay que alcança a rede interna do VPS deixa qualquer pessoa com a
      # credencial sondar os outros containers do Coolify e o Postgres.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # WebRTC só aloca relay UDP, e a CLI de administração não tem por que
      # existir aqui.
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-cli
